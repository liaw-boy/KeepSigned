name: SampleApp
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # KeepSigned passes each user's own prefix and team on the xcodebuild command line,
    # so nothing personal is stored in this project.
    BUNDLE_ID_PREFIX: dev.example
targets:
  SampleApp:
    type: application
    platform: iOS
    sources: [SampleApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sampleapp
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SampleApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
